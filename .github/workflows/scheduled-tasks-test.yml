name: Scheduled Workflow Tasks
on:
  workflow_dispatch:
  schedule:
    - cron: '0 04 * * 1-5'
      timezone: "Europe/Oslo"

jobs:
  check-last-workflow-run:
    uses: entur/abt-gha-public/.github/workflows/maybe-release-bot-updates-maven.yml@reduceMavenReleases
    with:
      workflow: deploy-main.yml
      release-branch: main
      trigger-release: false
      channel-id: ${{ vars.ALERT_CHANNEL_ID }}
    secrets: inherit
    permissions:
      contents: read
      actions: write
